# MuJoCo simulator parameters (phase pm). Everything the experiment itself needs
# (maze, motion/sensing model the policy assumes, policy, seeds) stays in
# lidar_sim/configs/default.yaml; this file only holds what the physics needs.
#
# Override single values on the command line:
#   python run_mujoco.py --mj-set noise.bad_return_on=true --mj-set controller.v_max=0.2
# Unknown keys are an error.

robot: mecanum              # mecanum (Level A, sim/mecanum.py) | point (the setup guide's prototype)

mecanum:                    # sim/mecanum.py and sim/tof.py; the physical robot is RobotConfig in code
  controller:
    yaw_mode: locked        # locked | held (D1: yaw hinge + IMU gyro + heading hold)
    v_max: 0.30             # m/s cruise
    accel: 1.0              # m/s^2
    kp_pos: 5.0             # 1/s, position loop on encoder odometry
    kp_heading: 10.0        # 1/s, heading hold on the integrated gyro (held mode)
    wall_centering: true    # side ToF seeing a wall in the own cell corrects lateral odometry
    centering_gain: 0.5     # fraction of the lateral error corrected per ToF sample
    centering_window: 0.06  # m, only this close to a cell centre (side cone fully on the own wall)
    front_alignment: true   # near the end of a move, the front ToF facing a wall in the target cell
                            # corrects the distance along the move
    strafe_compensation: true  # firmware scales sideways odometry by the calibrated mean strafe efficiency
    tof_period: 0.033       # s, ToF timing budget (30 Hz)
    kp_wheel: 0.005         # duty per rad/s, wheel PI on encoder speed
    ki_wheel: 0.05          # duty per rad
    speed_window: 5         # physics steps (1 ms each) for the encoder speed estimate
    eps_x: 0.002            # m, odometry error to stop
    eps_v: 0.005            # m/s, speed to stop
    t_min: 0.05             # s
    timeout: 3.0            # s
    settle: 0.02            # s with all commands zero after a move
  noise:                    # placeholders until calibrated (proposal §5, §6)
    radius_on: false
    radius_sigma: 0.01      # per-wheel effective radius error, per episode
    strafe_on: false
    strafe_eff_mean: 0.90   # sideways efficiency, per episode
    strafe_eff_sigma: 0.05
    slip_on: false
    slip_sigma: 0.02        # per action, each twist component
    yaw_drift_on: false     # held mode only
    yaw_drift_rw: 0.01      # rad/s per sqrt(s), random walk of a yaw-rate disturbance
    imu_on: false           # held mode only
    gyro_noise: 0.005       # rad/s white
    gyro_bias_rw: 0.0001    # rad/s per sqrt(s)
    accel_noise: 0.02       # m/s^2
    tof_noise_on: false
    tof_a: 0.003            # m, sigma(d) = a + b * d, widened by the cone's return spread
    tof_b: 0.01
    tof_spread_gain: 1.0
    tof_close_factor: 5.0   # sigma x 5 below the 40 mm minimum range
    bad_return_on: false
    p_bad_return: 0.05      # decision 2: a miss is a noisy reading, never empty
    bad_return_sigma: 0.15  # m
  tof:
    model: cone             # cone | center_ray
    fov_deg: 15.0           # 15 = ROI 4x4; 27 (ROI 16x16) sees the corridor's side walls (D5)
    grid: 5                 # 5 x 5 rays trimmed to the cone = 21
    beam_sigma_frac: 0.5    # Gaussian beam profile, sigma / half-FoV (assumed)
    min_range: 0.040        # m
    max_range: 1.300        # m

# ----- point robot only (robot: point) -----
controller:                 # sim/env.py MazeSim (m1.2)
  kp: 4.0                   # 1/s, P gain from position error to velocity command
  v_max: 0.30               # m/s, command limit per axis
  eps_v: 0.001              # m/s, "at rest" speed
  eps_x: 0.003              # m, "on target" position error
  t_min: 0.05               # s, no stop test before this (speed is 0 at t = 0)
  timeout: 3.0              # s of simulated time per action

noise:                      # sim/noise.py NoiseConfig (m2). All off = the m1 baseline.
                            # Values are placeholders until m2.4 (datasheet / predecessor logs).
  friction_on: false
  mu_lo: 0.05               # N, slide-joint frictionloss, drawn per episode
  mu_hi: 0.30
  vel_noise_on: false
  vel_sigma: 0.05           # multiplicative velocity-command noise, per action
  heading_sigma: 0.05       # rad, command rotation; the only source of sideways drift
  stop_jitter_on: false
  stop_jitter_s: 0.05       # s, extra coasting U[0, stop_jitter_s], per action
  range_noise_on: false
  range_a: 0.002            # m, sigma(r) = a + b * r on every reading
  range_b: 0.02
  bad_return_on: false
  p_bad_return: 0.05        # a ray that does not return properly (a "miss"): noisy, never empty
  bad_return_sigma: 0.15    # m
